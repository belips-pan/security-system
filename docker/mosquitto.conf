# Authentication + per-topic authorization, applied globally to every
# listener below (allow_anonymous/password_file/acl_file are global settings
# in this config - Mosquitto errors on "Duplicate ... value" if they're
# repeated per-listener without per_listener_settings true). The mosquitto
# service's command in docker-compose.yml runs mosquitto_passwd at container
# start to (re)generate /mosquitto/data/passwd from MOSQUITTO_PASSWORD/
# MOSQUITTO_AGENT_PASSWORD in docker/.env, for a fixed set of usernames
# (edge_gateway, camera_agent, drone_agent, iot_agent, plc_agent,
# robot_agent) - so the password file never needs to be committed to source.
# docker/mosquitto.acl then restricts each of those usernames to its own
# topic prefix - see that file for details.
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/mosquitto.acl

listener 1883

listener 9001
protocol websockets

log_dest stdout
