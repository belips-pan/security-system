# Backend VM1
version: '3.8'

services:
  scanner-preload:
    image: docker:latest
    container_name: scanner_preloader
    command: >
      sh -c "
      echo '📦 Loading security scanner images...'
      
      # Pull nmap image
      docker pull instrumentisto/nmap:latest || echo '⚠️ Failed to pull nmap'
      
      # Create nmap alias (if used by the code)
      docker tag instrumentisto/nmap instrumentisto/mmap 2>/dev/null || true
      
      # Pull nuclei image
      docker pull projectdiscovery/nuclei:latest || echo '⚠️ Failed to pull nuclei'
      
      echo '✅ Scanner images loaded or already exist'
      "
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring-network
    restart: "no"

  postgres:
    image: postgres:15
    container_name: docker_postgres_1
    environment:
      POSTGRES_DB: security_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "15433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./unified_schema.sql:/docker-entrypoint-initdb.d/01-unified-schema.sql
      - ./init.sql:/docker-entrypoint-initdb.d/02-init.sql
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d security_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: docker_zookeeper_1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: docker_kafka_1
    depends_on:
      - zookeeper
    ports:
      - "19093:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: docker_mosquito_1
    ports:
      - "1883:1883"
      - "19002:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - monitoring-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docker_redis_1
    ports:
      - "16379:6379"
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 2

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: docker_backend_1
    ports:
      - "15000:5000"
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/security_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-change-in-production
      - FLASK_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../src/backend:/app/src/backend
      - backend_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:rw
    user: "0:0"
    networks:
      - monitoring-network
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 app:app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    container_name: docker_celery-worker_1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://admin:password@postgres:5432/security_db
      - DOCKER_HOST=unix:///var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../src/backend:/app/src/backend
    command: ["celery", "-A", "celery_tasks", "worker", "-Q", "scans,celery", "--loglevel=info"]
    working_dir: /app/src/backend
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/healthcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    container_name: docker_celery-beat_1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://admin:password@postgres:5432/security_db
      - PYTHONPATH=/app:/app/src/backend
    # Σημαντικό: Το entrypoint.sh θα τρέξει το "celery -A src.backend.celery_tasks beat"
    command: ["celery", "-A", "celery_tasks", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid"]
    working_dir: /app/src/backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../src/backend:/app/src/backend
    command: ["beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - monitoring-network
    restart: unless-stopped

#  rabbitmq:
#    image: rabbitmq:3-management
#    ports:
#      - "5672:5672"
#      - "15672:15672"

  flower:
    image: mher/flower:latest
    container_name: docker_flower_fixed
    ports:
      - "15556:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_BROKER=redis://redis:6379/0
      - FLOWER_ADDRESS=0.0.0.0
      - FLOWER_PORT=5555
    depends_on:
      - redis
    networks:
      - monitoring-network

volumes:
  postgres_data:
  backend_logs:

networks:
  monitoring-network:
    driver: bridge