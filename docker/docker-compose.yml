# Backend VM1

services:
  scanner-preload:
    image: docker:latest
    container_name: scanner_preloader
    command: >
      sh -c "
      echo '📦 Loading security scanner images...'

      # Pull nmap image
      docker pull instrumentisto/nmap:latest || echo '⚠️ Failed to pull nmap'

      # Pull nuclei image
      docker pull projectdiscovery/nuclei:latest || echo '⚠️ Failed to pull nuclei'

      echo '✅ Scanner images loaded or already exist'
      "
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring-network
    restart: "no"

  postgres:
    image: postgres:15
    container_name: docker_postgres_1
    environment:
      POSTGRES_DB: security_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "15433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./unified_schema.sql:/docker-entrypoint-initdb.d/01-unified-schema.sql
      - ./init.sql:/docker-entrypoint-initdb.d/02-init.sql
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d security_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: docker_zookeeper_1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: docker_kafka_1
    depends_on:
      - zookeeper
    ports:
      - "19093:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 768m

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: docker_mosquito_1
    environment:
      # edge_gateway's own credential
      - MOSQUITTO_PASSWORD=${MOSQUITTO_PASSWORD}
      # shared by all five agent-type users (camera_agent, drone_agent,
      # iot_agent, plc_agent, robot_agent) - see docker/mosquitto.acl for
      # why type-level sharing is an acceptable tradeoff here
      - MOSQUITTO_AGENT_PASSWORD=${MOSQUITTO_AGENT_PASSWORD}
    ports:
      - "1883:1883"
      - "19002:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto.acl:/mosquitto/config/mosquitto.acl
      - mosquitto_data:/mosquitto/data
    # Generate/refresh the password file from env vars at container start
    # (mosquitto_passwd ships in the eclipse-mosquitto image), then hand off
    # to mosquitto itself. Usernames are fixed literals matching
    # docker/mosquitto.acl - see mosquitto.conf for the auth/ACL directives.
    command: >
      sh -c "
      mosquitto_passwd -b -c /mosquitto/data/passwd edge_gateway \"$$MOSQUITTO_PASSWORD\" &&
      for u in camera_agent drone_agent iot_agent plc_agent robot_agent; do
        mosquitto_passwd -b /mosquitto/data/passwd \"$$u\" \"$$MOSQUITTO_AGENT_PASSWORD\";
      done &&
      exec mosquitto -c /mosquitto/config/mosquitto.conf
      "
    networks:
      - monitoring-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docker_redis_1
    # Auth required - see #1 in the hardening review: an unauthenticated
    # Redis broker let anyone who could reach this port enqueue Celery scan
    # tasks directly, bypassing require_api_key entirely.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "16379:6379"
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 2

  docker-socket-proxy:
    # Fronts the host Docker socket with a read-only-mounted proxy scoped to
    # only the endpoint groups the scanner actually needs (pulling/running/
    # removing the nmap+nuclei containers). backend/celery-worker talk to
    # this over plain TCP on the internal compose network instead of getting
    # the raw socket bind-mounted - see backend/celery-worker below.
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker_socket_proxy_1
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - POST=1
      - PING=1
      - VERSION=1
      - INFO=1
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EVENTS=0
      - EXEC=0
      - NETWORKS=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring-network
    restart: unless-stopped
    mem_limit: 128m

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: docker_backend_1
    ports:
      - "15000:5000"
    environment:
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/security_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      # Shared with monsys (a separate deployment on another VM) - its
      # SCANNER_API_KEY/BACKEND_API_KEY/SCANNER_BACKEND_API_KEY must be set
      # to this exact same value. See docker/.env.example.
      - CONTAINER_SCANNER_API_KEY=${CONTAINER_SCANNER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    volumes:
      - ../src/backend:/app/src/backend
      - backend_logs:/app/logs
      # Docker access now goes through docker-socket-proxy (see above)
      # instead of a raw rw bind-mount of the host socket as root. This
      # replaces the previous "mounts /var/run/docker.sock as root" setup;
      # the container runs as the non-root user set in Dockerfile.backend.
    networks:
      - monitoring-network
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 app:app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    container_name: docker_celery-worker_1
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/security_db
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    volumes:
      # Docker access now goes through docker-socket-proxy (see that service
      # above) instead of a raw rw bind-mount of the host socket as root.
      - ../src/backend:/app/src/backend
    command: ["celery", "-A", "celery_tasks", "worker", "-Q", "scans,celery", "--loglevel=info"]
    working_dir: /app/src/backend
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/healthcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    container_name: docker_celery-beat_1
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/security_db
      - PYTHONPATH=/app:/app/src/backend
    # Σημαντικό: Το entrypoint.sh θα τρέξει το "celery -A src.backend.celery_tasks beat"
    command: ["celery", "-A", "celery_tasks", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid"]
    working_dir: /app/src/backend
    volumes:
      # beat only schedules periodic tasks (celery-worker executes them), so
      # it never needs Docker access - no socket mount here.
      - ../src/backend:/app/src/backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - monitoring-network
    restart: unless-stopped
    mem_limit: 512m

#  rabbitmq:
#    image: rabbitmq:3-management
#    ports:
#      - "5672:5672"
#      - "15672:15672"

  flower:
    image: mher/flower:latest
    container_name: docker_flower_fixed
    ports:
      # Matches the port referenced by start.sh/start-fast.sh/check.sh
      - "15555:5555"
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - FLOWER_BROKER=redis://:${REDIS_PASSWORD}@redis:6379/0
      - FLOWER_ADDRESS=0.0.0.0
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=admin:${FLOWER_PASSWORD}
    depends_on:
      - redis
    networks:
      - monitoring-network
    mem_limit: 256m

volumes:
  postgres_data:
  backend_logs:
  mosquitto_data:

networks:
  monitoring-network:
    driver: bridge
